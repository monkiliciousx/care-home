<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d8f7a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="今日大马" />
  <meta name="description" content="今日大马：面向来马中国人的中文生活服务平台。" />
  <title>今日大马 Today MY</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="desktop-backdrop" aria-hidden="true"></div>

  <div class="app-shell">
    <aside class="desktop-sidebar" aria-label="桌面导航">
      <button class="desktop-brand" data-view="home" aria-label="返回首页">
        <span class="brand-mark">MY</span>
        <span><strong>今日大马</strong><small>Today Malaysia</small></span>
      </button>
      <nav id="desktopNav" class="desktop-nav-list"></nav>
      <div class="sidebar-card">
        <span class="mini-badge">来马必备</span>
        <strong>第一次来马？</strong>
        <p>从签证、电话卡到租房开户，一站式快速了解。</p>
        <button data-action="open-guide-starter">查看新手指南</button>
      </div>
      <p class="sidebar-foot">Prototype · Front-end Demo</p>
    </aside>

    <main class="mobile-app" id="mobileApp">
      <header class="app-header">
        <button class="location-button" data-action="location">
          <span class="location-pin">⌖</span>
          <span><small>当前城市</small><strong id="currentCityLabel">吉隆坡</strong></span>
          <span class="chevron">⌄</span>
        </button>
        <div class="header-actions">
          <button class="icon-button" data-action="notifications" aria-label="通知">
            <span data-icon="bell"></span><i id="notificationDot"></i>
          </button>
          <button class="profile-avatar" data-view="profile" aria-label="我的">安</button>
        </div>
      </header>

      <section id="viewContainer" class="view-container" aria-live="polite"></section>

      <nav id="bottomNav" class="bottom-nav" aria-label="底部导航"></nav>
    </main>
  </div>

  <div id="sheetOverlay" class="sheet-overlay" hidden></div>
  <section id="bottomSheet" class="bottom-sheet" aria-modal="true" role="dialog" hidden>
    <div class="sheet-handle"></div>
    <div id="sheetContent"></div>
  </section>

  <div id="modalOverlay" class="modal-overlay" hidden></div>
  <section id="detailModal" class="detail-modal" aria-modal="true" role="dialog" hidden>
    <button class="modal-close" data-action="close-modal" aria-label="关闭">×</button>
    <div id="modalContent"></div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <template id="emptyStateTemplate">
    <div class="empty-state">
      <div class="empty-icon">◎</div>
      <strong>暂时没有内容</strong>
      <p>换一个筛选条件试试看。</p>
    </div>
  </template>

  <script src="app.js" defer></script>
</body>
</html>
